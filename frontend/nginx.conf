server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Upload limit of POST /api/analyze is 20 MB for both files together (MAX_BYTES in api/app.py).
    # One MB of slack for the multipart wrapping, so the API's own JSON error is what users see.
    client_max_body_size 21m;

    gzip on;
    gzip_types text/css application/javascript text/csv application/json;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;   # a large upload can take a while to analyse
    }

    location = /health {
        proxy_pass http://api:8000;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";   # a deploy shows up on the next reload
    }
}
