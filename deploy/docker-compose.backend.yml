# Override: the "api" service becomes the real backend/ instead of the mock.
# Run from the repo root (paths are relative to the first -f file):
#   docker compose -f docker-compose.yml -f deploy/docker-compose.backend.yml up -d --build
#
# Until the backend has POST /api/analyze, the page still shows the backend's own
# data, and an upload gives a clear "server does not accept uploads yet" message.
services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # To serve a real dataset, uncomment and put the file in data/raw/ on the server:
    # environment:
    #   POSTS_FILE: /data/posts.jsonl
    # volumes:
    #   - ./data/raw:/data:ro
